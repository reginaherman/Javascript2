<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
</head>
<body>
    <h1>JAVASCRIPT ARRAY METHODS</h1>
    <p>The join() method is used to join all elements of an array into a string.</p>
    <p>The pop() method removes the last element from an  array</p>
    <p id="myjoin"></p>
    <p id="mypop1"></p>
    <p id="mypop2"></p>
    <script>
        var fruits = ["Banana", "Orange", "Apple", "Grapes"];
        document.getElementById("myjoin").innerHTML =fruits.join(" !");
        document.getElementById("mypop1").innerHTML =fruits;
         fruits.pop();
        document.getElementById("mypop2").innerHTML =fruits;
    </script>
</body>
</html>
